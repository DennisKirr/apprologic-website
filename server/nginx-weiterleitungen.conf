# Weiterleitungen auf die Hauptadresse https://www.apprologic.de
# Damit Google jede Seite nur unter einer Adresse kennt (keine doppelten Inhalte).
# Diese beiden server-Blöcke zusätzlich zum bestehenden HTTPS-Block für www.apprologic.de anlegen.
# Pfade der Zertifikate an die vorhandene Einrichtung (z. B. certbot) anpassen.

# 1. Alles über HTTP (ohne Verschlüsselung) -> https://www.apprologic.de
server {
    listen 80;
    listen [::]:80;
    server_name apprologic.de www.apprologic.de;
    return 301 https://www.apprologic.de$request_uri;
}

# 2. https://apprologic.de (ohne www) -> https://www.apprologic.de
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name apprologic.de;

    ssl_certificate     /etc/letsencrypt/live/apprologic.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apprologic.de/privkey.pem;

    return 301 https://www.apprologic.de$request_uri;
}

# Hinweis: Mit diesen Weiterleitungen erreicht das Kontaktformular den Dienst nur noch über
# www.apprologic.de. ALLOWED_ORIGINS in /etc/apprologic-kontakt.env kann dann auf
# https://www.apprologic.de beschränkt werden.
#
# service-pacemaker.com NICHT hierher umleiten: Die Domain wird für das Produkt
# (Portale, Mailversand) genutzt.
