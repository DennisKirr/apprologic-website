<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Schnittstellen des Service Pacemaker: Links Ihre Systeme – ERP-Systeme wie SAP oder Microsoft Dynamics 365, Teilekatalog, Webshop, Dateiablage und Redaktionssystem, Ticketsystem und CRM, IoT-Plattform, Identity Provider. In der Mitte der Service Pacemaker mit RESTful API, Berechtigungen und Business Rules. Rechts die Anwender in Web und App: Kunden, Händler und Servicepartner, Techniker, Serviceteam.">
  <style>
    text { font-family: "Work Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .t { font-size: 15px; font-weight: 600; fill: #175173; }
    .s { font-size: 12px; fill: #6f777c; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .cap { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; fill: #17805f; }
    .flow { stroke-dasharray: 2 12; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f0f5"/>
      <stop offset="1" stop-color="#f7fafc"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".12" r=".55">
      <stop offset="0" stop-color="#24b38a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#24b38a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset=".4" stop-color="#1c638c" stop-opacity=".12"/>
      <stop offset="1" stop-color="#1c638c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#175173"/>
      <stop offset="1" stop-color="#1c638c"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#c9d9e3"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f3a53" flood-opacity=".2"/>
    </filter>
    <filter id="shadow-sm" x="-10%" y="-30%" width="120%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f3a53" flood-opacity=".09"/>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#dots)" opacity=".7"/>
  <rect width="1200" height="560" fill="url(#glow)"/>
  <circle cx="600" cy="280" r="220" fill="url(#halo)"/>

  <!-- Verbindungen links -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#c3d5e1" stroke-width="2">
      <path d="M330 102C405 102 405 214 480 214"/>
      <path d="M330 166C405 166 405 236 480 236"/>
      <path d="M330 230C405 230 405 258 480 258"/>
      <path d="M330 294C405 294 405 280 480 280"/>
      <path d="M330 358C405 358 405 302 480 302"/>
      <path d="M330 422C405 422 405 324 480 324"/>
      <path d="M330 486C405 486 405 346 480 346"/>
    </g>
    <g class="flow" stroke="#24b38a" stroke-width="3.5">
      <path d="M330 102C405 102 405 214 480 214"/>
      <path d="M330 166C405 166 405 236 480 236"/>
      <path d="M330 230C405 230 405 258 480 258"/>
      <path d="M330 294C405 294 405 280 480 280"/>
      <path d="M330 358C405 358 405 302 480 302"/>
      <path d="M330 422C405 422 405 324 480 324"/>
      <path d="M330 486C405 486 405 346 480 346"/>
    </g>
  </g>
  <!-- Verbindungen rechts -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#c3d5e1" stroke-width="2">
      <path d="M720 235C795 235 795 160 870 160"/>
      <path d="M720 265C795 265 795 240 870 240"/>
      <path d="M720 295C795 295 795 320 870 320"/>
      <path d="M720 325C795 325 795 400 870 400"/>
    </g>
    <g class="flow" stroke="#1c638c" stroke-opacity=".75" stroke-width="3.5">
      <path d="M720 235C795 235 795 160 870 160"/>
      <path d="M720 265C795 265 795 240 870 240"/>
      <path d="M720 295C795 295 795 320 870 320"/>
      <path d="M720 325C795 325 795 400 870 400"/>
    </g>
  </g>

  <!-- Ihre Systeme -->
  <text x="50" y="52" class="cap">IHRE SYSTEME</text>
  <g filter="url(#shadow-sm)" fill="#fff">
    <rect x="50" y="76" width="280" height="52" rx="12"/>
    <rect x="50" y="140" width="280" height="52" rx="12"/>
    <rect x="50" y="204" width="280" height="52" rx="12"/>
    <rect x="50" y="268" width="280" height="52" rx="12"/>
    <rect x="50" y="332" width="280" height="52" rx="12"/>
    <rect x="50" y="396" width="280" height="52" rx="12"/>
    <rect x="50" y="460" width="280" height="52" rx="12"/>
  </g>
  <g fill="#24b38a">
    <rect x="50" y="88" width="4" height="28" rx="2"/><rect x="50" y="152" width="4" height="28" rx="2"/>
    <rect x="50" y="216" width="4" height="28" rx="2"/><rect x="50" y="280" width="4" height="28" rx="2"/>
    <rect x="50" y="344" width="4" height="28" rx="2"/><rect x="50" y="408" width="4" height="28" rx="2"/>
    <rect x="50" y="472" width="4" height="28" rx="2"/>
  </g>
  <text x="70" y="98" class="t">ERP-System</text><text x="70" y="116" class="s">z. B. SAP, Microsoft Dynamics 365</text>
  <text x="70" y="162" class="t">Teilekatalog</text><text x="70" y="180" class="s">Teilelisten, Explosionszeichnungen</text>
  <text x="70" y="226" class="t">Webshop</text><text x="70" y="244" class="s">Preise, Verfügbarkeit, Bestellung</text>
  <text x="70" y="290" class="t">Dateiablage / Redaktionssystem</text><text x="70" y="308" class="s">Handbücher, Pläne, Videos</text>
  <text x="70" y="354" class="t">Ticketsystem / CRM</text><text x="70" y="372" class="s">Anfragen und Status</text>
  <text x="70" y="418" class="t">IoT-Plattform</text><text x="70" y="436" class="s">Zustandsdaten, Fehlercodes, Ereignisse</text>
  <text x="70" y="482" class="t">Identity Provider</text><text x="70" y="500" class="s">Single Sign-on</text>

  <!-- Service Pacemaker -->
  <g filter="url(#shadow)">
    <rect x="480" y="190" width="240" height="180" rx="24" fill="url(#hub)"/>
  </g>
  <text x="600" y="232" text-anchor="middle" style="font-size:20px;font-weight:600" fill="#fff">Service Pacemaker</text>
  <g fill="#fff" fill-opacity=".14">
    <rect x="520" y="252" width="160" height="26" rx="13"/>
    <rect x="520" y="286" width="160" height="26" rx="13"/>
    <rect x="520" y="320" width="160" height="26" rx="13"/>
  </g>
  <g text-anchor="middle" style="font-size:12.5px;font-family:'Open Sans','Segoe UI',Arial,sans-serif" fill="#fff">
    <text x="600" y="269.5">RESTful API</text>
    <text x="600" y="303.5">Berechtigungen</text>
    <text x="600" y="337.5">Business Rules</text>
  </g>

  <!-- Anwender -->
  <text x="870" y="112" class="cap">ANWENDER · WEB UND APP</text>
  <g filter="url(#shadow-sm)" fill="#fff">
    <rect x="870" y="130" width="280" height="60" rx="12"/>
    <rect x="870" y="210" width="280" height="60" rx="12"/>
    <rect x="870" y="290" width="280" height="60" rx="12"/>
    <rect x="870" y="370" width="280" height="60" rx="12"/>
  </g>
  <g fill="#1c638c">
    <rect x="1146" y="144" width="4" height="32" rx="2"/><rect x="1146" y="224" width="4" height="32" rx="2"/>
    <rect x="1146" y="304" width="4" height="32" rx="2"/><rect x="1146" y="384" width="4" height="32" rx="2"/>
  </g>
  <text x="892" y="165" class="t">Kunden</text>
  <text x="892" y="245" class="t">Händler und Servicepartner</text>
  <text x="892" y="325" class="t">Techniker</text>
  <text x="892" y="405" class="t">Serviceteam</text>
</svg>
