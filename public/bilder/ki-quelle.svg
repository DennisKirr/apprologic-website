<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="KI-Assistent mit Quellenangabe: links die Frage, was beim Tausch der Glasscheibe zu beachten ist, und die Antwort in drei Schritten, jeder Schritt mit Verweis auf Dokument und Seite. Rechts die Quellseite 42 des Wartungshandbuchs, die zitierte Passage ist markiert. Die KI antwortet nur aus freigegebenen Dokumenten.">
  <style>
    text { font-family: "Work Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .t { font-size: 13.5px; font-weight: 600; fill: #175173; }
    .s { font-size: 11.5px; fill: #6f777c; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .a { font-size: 12.5px; fill: #175173; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .ref { font-size: 9.5px; font-weight: 700; fill: #17805f; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; text-anchor: middle; }
    .chip { font-size: 11px; font-weight: 600; fill: #1c638c; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .pg { font-size: 10.5px; fill: #6f777c; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f0f5"/>
      <stop offset="1" stop-color="#f7fafc"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".12" r=".55">
      <stop offset="0" stop-color="#24b38a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#24b38a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24b38a"/>
      <stop offset="1" stop-color="#1c638c"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#c9d9e3"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f3a53" flood-opacity=".22"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f3a53" flood-opacity=".12"/>
    </filter>
    <clipPath id="win"><rect x="60" y="30" width="1080" height="500" rx="14"/></clipPath>
  </defs>

  <!-- Hintergrund -->
  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#dots)" opacity=".7"/>
  <rect width="1200" height="560" fill="url(#glow)"/>

  <!-- Fenster -->
  <rect x="60" y="30" width="1080" height="500" rx="14" fill="#fff" filter="url(#shadow)"/>
  <g clip-path="url(#win)">
    <rect x="60" y="30" width="1080" height="42" fill="#f4f8fa"/>
    <rect x="660" y="72" width="480" height="458" fill="#eef3f6"/>
  </g>
  <path d="M60 72H1140M660 72V530" stroke="#e3ebf0" stroke-width="1.5"/>
  <g fill="#d3dee5"><circle cx="82" cy="51" r="5"/><circle cx="100" cy="51" r="5"/><circle cx="118" cy="51" r="5"/></g>
  <text x="142" y="55" class="s" style="font-size:12px">Bearbeitungszentrum · SN 24-1087  ›  <tspan style="fill:#175173;font-weight:600">KI-Assistent</tspan></text>

  <!-- ============ Chat ============ -->
  <circle cx="98" cy="102" r="16" fill="url(#ai)"/>
  <path d="M98 93L100.5 99.5L107 102L100.5 104.5L98 111L95.5 104.5L89 102L95.5 99.5Z" fill="#fff"/>
  <text x="124" y="99" class="t" style="font-size:14.5px">KI-Assistent</text>
  <text x="124" y="116" class="s">Antworten aus Ihrer Dokumentation</text>
  <rect x="540" y="90" width="100" height="24" rx="12" fill="#e9f7f2"/>
  <circle cx="554" cy="102" r="4" fill="#24b38a"/>
  <text x="564" y="106" class="chip" style="fill:#17805f">SN 24-1087</text>
  <path d="M76 134H644" stroke="#eef3f6" stroke-width="1.5"/>

  <rect x="352" y="148" width="288" height="50" rx="14" fill="#1c638c"/>
  <text x="368" y="169" class="a" style="fill:#fff">Was muss beim Tausch der Glasscheibe</text>
  <text x="368" y="186" class="a" style="fill:#fff">beachtet werden?</text>

  <circle cx="92" cy="226" r="12" fill="url(#ai)"/>
  <path d="M92 219.5L93.8 224.2L98.5 226L93.8 227.8L92 232.5L90.2 227.8L85.5 226L90.2 224.2Z" fill="#fff"/>
  <rect x="112" y="212" width="528" height="202" rx="14" fill="#f4f8fa"/>
  <text x="130" y="238" class="t" style="font-size:13px">Laut Wartungshandbuch in drei Schritten:</text>

  <g fill="#24b38a"><circle cx="140" cy="266" r="10"/><circle cx="140" cy="316" r="10"/><circle cx="140" cy="366" r="10"/></g>
  <g style="font-size:11px;font-weight:700" fill="#fff" text-anchor="middle"><text x="140" y="270">1</text><text x="140" y="320">2</text><text x="140" y="370">3</text></g>
  <text x="160" y="264" class="a">Maschine ausschalten und gegen Wiedereinschalten</text>
  <text x="160" y="281" class="a">sichern, Hauptschalter abschließen.</text>
  <text x="160" y="314" class="a" style="font-weight:600">Dichtung prüfen und bei Bedarf ersetzen, Auflage</text>
  <text x="160" y="331" class="a" style="font-weight:600">vor dem Einsetzen reinigen.</text>
  <text x="160" y="364" class="a">Schrauben über Kreuz mit 8 Nm anziehen und</text>
  <text x="160" y="381" class="a">nach einer Betriebsstunde nachziehen.</text>

  <g fill="#e9f7f2" stroke="#bfe6d6">
    <rect x="588" y="254" width="36" height="18" rx="9"/>
    <rect x="588" y="304" width="36" height="18" rx="9"/>
    <rect x="588" y="354" width="36" height="18" rx="9"/>
  </g>
  <rect x="588" y="304" width="36" height="18" rx="9" fill="#17805f"/>
  <text x="606" y="266.5" class="ref">S. 41</text>
  <text x="606" y="316.5" class="ref" style="fill:#fff">S. 42</text>
  <text x="606" y="366.5" class="ref">S. 42</text>
  <text x="130" y="402" class="s" style="font-size:11px">Quelle: Wartungshandbuch Bearbeitungszentrum, Kapitel 6</text>

  <g fill="#fff" stroke="#d3dee5" stroke-width="1.2">
    <rect x="112" y="426" width="178" height="26" rx="8"/><rect x="298" y="426" width="178" height="26" rx="8"/>
  </g>
  <g fill="none" stroke="#1c638c" stroke-width="1.4" stroke-linejoin="round">
    <path d="M124 432H131L135 436V446H124Z"/><path d="M310 432H317L321 436V446H310Z"/>
  </g>
  <text x="142" y="443" class="chip">Wartungshandbuch, S. 41</text>
  <text x="328" y="443" class="chip">Wartungshandbuch, S. 42</text>
  <path d="M492 437L496 441L503 433" fill="none" stroke="#17805f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="510" y="443" class="s" style="font-size:11px">Nur freigegebene Quellen</text>

  <rect x="76" y="472" width="568" height="40" rx="20" fill="#f4f8fa" stroke="#e3ebf0"/>
  <text x="98" y="497" class="s" style="font-size:12.5px;fill:#8a969d">Frage stellen …</text>
  <circle cx="622" cy="492" r="14" fill="#17805f"/>
  <path d="M616 492H628M623 487L628 492L623 497" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Verbindung Antwort ↔ Quelle -->
  <path d="M624 313C650 313 660 300 700 300" fill="none" stroke="#24b38a" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="700" cy="300" r="4" fill="#24b38a"/>

  <!-- ============ Quellseite ============ -->
  <text x="684" y="100" class="t">Wartungshandbuch</text>
  <text x="684" y="118" class="s">Kapitel 6 · Seite 42 von 118</text>
  <g fill="#fff" stroke="#d3dee5" stroke-width="1.2"><rect x="1036" y="88" width="30" height="28" rx="7"/><rect x="1074" y="88" width="30" height="28" rx="7"/></g>
  <path d="M1054 96L1046 102L1054 108M1086 96L1094 102L1086 108" fill="none" stroke="#175173" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="692" y="136" width="416" height="378" fill="#fff" filter="url(#paper)"/>
  <text x="716" y="166" class="t" style="font-size:12.5px">6.4 Glasscheibe der Schutztür tauschen</text>
  <g fill="#e3ebf0">
    <rect x="716" y="180" width="364" height="7" rx="3.5"/><rect x="716" y="194" width="340" height="7" rx="3.5"/>
    <rect x="716" y="208" width="352" height="7" rx="3.5"/><rect x="716" y="222" width="220" height="7" rx="3.5"/>
  </g>
  <rect x="716" y="244" width="364" height="30" rx="4" fill="#fdf3e0"/>
  <text x="728" y="263" class="pg" style="fill:#8a5a00;font-weight:600">⚠ Vor allen Arbeiten Hauptschalter abschließen.</text>

  <rect x="706" y="288" width="386" height="64" rx="6" fill="#24b38a" fill-opacity=".14" stroke="#24b38a" stroke-width="1.5"/>
  <g fill="#8fd3bb">
    <rect x="716" y="300" width="360" height="7" rx="3.5"/><rect x="716" y="314" width="348" height="7" rx="3.5"/>
    <rect x="716" y="328" width="366" height="7" rx="3.5"/><rect x="716" y="342" width="200" height="4" rx="2"/>
  </g>

  <rect x="716" y="366" width="170" height="118" rx="4" fill="#f4f8fa" stroke="#e3ebf0"/>
  <rect x="740" y="384" width="122" height="82" rx="3" fill="none" stroke="#9fb3c0" stroke-width="2"/>
  <rect x="752" y="396" width="98" height="58" fill="#dfeaf1"/>
  <g fill="#175173"><circle cx="746" cy="390" r="3"/><circle cx="856" cy="390" r="3"/><circle cx="746" cy="460" r="3"/><circle cx="856" cy="460" r="3"/></g>
  <text x="801" y="478" text-anchor="middle" class="pg" style="font-size:9.5px">Abb. 6-7 Anzugsreihenfolge</text>
  <g fill="#e3ebf0">
    <rect x="904" y="370" width="176" height="7" rx="3.5"/><rect x="904" y="384" width="160" height="7" rx="3.5"/>
    <rect x="904" y="398" width="170" height="7" rx="3.5"/><rect x="904" y="412" width="120" height="7" rx="3.5"/>
    <rect x="904" y="434" width="176" height="7" rx="3.5"/><rect x="904" y="448" width="150" height="7" rx="3.5"/>
  </g>
  <text x="1092" y="504" text-anchor="end" class="pg" style="font-size:9.5px">42</text>
</svg>
