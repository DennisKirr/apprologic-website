<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Vorher und nachher: Links liegen die Informationen zu einer Maschine heute verstreut – eine unbeantwortete E-Mail, ein Foto im Chat auf dem Diensthandy, eine Rückrufnotiz auf Papier, ein Wartungsplan als Excel-Datei und ein veraltetes Handbuch auf dem Netzlaufwerk. Rechts läuft alles in der Maschinenakte im Service Pacemaker zusammen: Status aus der IoT-Plattform, Dokumentation, offene Serviceanfrage, nächste Wartung, Ersatzteile und die Historie, gemeinsam genutzt von Kunde, Servicepartner und Serviceteam.">
  <style>
    text { font-family: "Work Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .t { font-size: 13px; font-weight: 600; fill: #175173; }
    .s { font-size: 11.5px; fill: #6f777c; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .ot { font-size: 12.5px; font-weight: 600; fill: #6f777c; }
    .os { font-size: 11px; fill: #9aa5ab; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .k { font-size: 10px; font-weight: 700; letter-spacing: .08em; fill: #8a969d; }
    .big { font-size: 17px; font-weight: 600; fill: #175173; }
    .cap { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; }
    .flow { stroke-dasharray: 2 10; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f0f5"/>
      <stop offset="1" stop-color="#f7fafc"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".12" r=".55">
      <stop offset="0" stop-color="#24b38a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#24b38a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#175173"/>
      <stop offset="1" stop-color="#1c638c"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f6"/>
      <stop offset="1" stop-color="#c9d4dc"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fb3c0"/>
      <stop offset="1" stop-color="#24b38a"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#c9d9e3"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f3a53" flood-opacity=".22"/>
    </filter>
    <filter id="shadow-sm" x="-10%" y="-30%" width="120%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f3a53" flood-opacity=".08"/>
    </filter>
    <clipPath id="screen"><rect x="424" y="58" width="712" height="408" rx="6"/></clipPath>
  </defs>

  <!-- Hintergrund -->
  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#dots)" opacity=".7"/>
  <rect width="1200" height="560" fill="url(#glow)"/>

  <!-- ============ Heute: verstreut ============ -->
  <text x="40" y="30" class="cap" fill="#8a969d">HEUTE: VERSTREUT</text>

  <g filter="url(#shadow-sm)" fill="#fff" fill-opacity=".85">
    <rect x="40" y="74" width="252" height="52" rx="10" transform="rotate(-2 166 100)"/>
    <rect x="62" y="158" width="252" height="52" rx="10" transform="rotate(2 188 184)"/>
    <rect x="34" y="242" width="252" height="52" rx="10" transform="rotate(-1.5 160 268)"/>
    <rect x="58" y="326" width="252" height="52" rx="10" transform="rotate(2.5 184 352)"/>
    <rect x="38" y="410" width="252" height="52" rx="10" transform="rotate(-2 164 436)"/>
  </g>

  <g fill="none" stroke="#9fb3c0" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <g transform="rotate(-2 166 100)"><rect x="54" y="91" width="20" height="15" rx="2"/><path d="M54 93L64 100L74 93"/></g>
    <g transform="rotate(2 188 184)"><path d="M78 180A10 10 0 1 1 82 188L76 190Z"/></g>
    <g transform="rotate(-1.5 160 268)"><path d="M52 259C52 258 53 257 54 257H57L59 262L57 264C58 267 60 269 63 270L65 268L70 270V273C70 274 69 275 68 275C59 275 52 268 52 259Z"/></g>
    <g transform="rotate(2.5 184 352)"><rect x="74" y="342" width="18" height="20" rx="2"/><path d="M74 349H92M74 355H92M80 342V362"/></g>
    <g transform="rotate(-2 164 436)"><path d="M52 428H60L63 431H72V444H52Z"/></g>
  </g>

  <g transform="rotate(-2 166 100)"><text x="86" y="97" class="ot">E-Mail: Störung Linie 3</text><text x="86" y="113" class="os">vor 3 Tagen, unbeantwortet</text></g>
  <g transform="rotate(2 188 184)"><text x="108" y="181" class="ot">Chat: Foto vom Typenschild</text><text x="108" y="197" class="os">auf dem Diensthandy</text></g>
  <g transform="rotate(-1.5 160 268)"><text x="82" y="265" class="ot">Anruf: Rückruf erbeten</text><text x="82" y="281" class="os">Notiz auf Papier</text></g>
  <g transform="rotate(2.5 184 352)"><text x="104" y="349" class="ot">Wartungsplan_final2.xlsx</text><text x="104" y="365" class="os">lokal gespeichert</text></g>
  <g transform="rotate(-2 164 436)"><text x="84" y="433" class="ot">Handbuch_v3_alt.pdf</text><text x="84" y="449" class="os">Netzlaufwerk</text></g>

  <!-- Zusammenführen -->
  <g fill="none" stroke="url(#fade)" stroke-width="2.5" stroke-linecap="round" class="flow">
    <path d="M296 98C350 100 360 250 414 262"/>
    <path d="M318 186C360 190 370 256 414 266"/>
    <path d="M290 268C340 268 370 270 414 270"/>
    <path d="M314 354C360 350 372 284 414 274"/>
    <path d="M294 434C350 430 362 290 414 278"/>
  </g>

  <!-- ============ Mit Service Pacemaker ============ -->
  <text x="424" y="30" class="cap" fill="#17805f">MIT SERVICE PACEMAKER: ALLES AN DER MASCHINE</text>

  <!-- Laptop -->
  <rect x="410" y="44" width="740" height="436" rx="18" fill="#1d2a33" filter="url(#shadow)"/>
  <rect x="424" y="58" width="712" height="408" rx="6" fill="#fff"/>
  <path d="M378 480H1182L1166 500C1162 505 1156 508 1148 508H412C404 508 398 505 394 500Z" fill="url(#base)"/>
  <rect x="740" y="480" width="80" height="6" rx="3" fill="#b8c5ce"/>

  <g clip-path="url(#screen)">
    <rect x="424" y="58" width="712" height="40" fill="url(#hub)"/>
  </g>
  <circle cx="446" cy="78" r="8" fill="none" stroke="#fff" stroke-width="2.5"/>
  <text x="462" y="83" style="font-size:13px;font-weight:600" fill="#fff">Serviceportal</text>
  <g stroke="#1c638c" stroke-width="2">
    <circle cx="1010" cy="78" r="11" fill="#7fd6b8"/><circle cx="1026" cy="78" r="11" fill="#b7d4e6"/><circle cx="1042" cy="78" r="11" fill="#f3d58a"/>
  </g>
  <g style="font-size:9px;font-weight:700" text-anchor="middle" fill="#175173">
    <text x="1010" y="81">K</text><text x="1026" y="81">P</text><text x="1042" y="81">S</text>
  </g>
  <text x="1062" y="82" class="s" style="fill:#fff;font-size:10.5px">3 Beteiligte</text>

  <!-- Kopf der Akte -->
  <rect x="446" y="114" width="52" height="52" rx="10" fill="#dfeaf1"/>
  <rect x="458" y="126" width="28" height="20" rx="3" fill="#9fb3c0"/><rect x="463" y="148" width="18" height="5" rx="2" fill="#9fb3c0"/>
  <text x="512" y="136" class="big">Bearbeitungszentrum</text>
  <text x="512" y="156" class="s">SN 24-1087 · Werk Nord, Halle 2 · betreut von Servicepartner Nord</text>
  <rect x="954" y="120" width="158" height="26" rx="13" fill="#e9f7f2"/>
  <circle cx="970" cy="133" r="4" fill="#24b38a"/>
  <text x="980" y="137.5" class="s" style="fill:#17805f;font-weight:600;font-size:11px">Läuft · aus IoT-Plattform</text>

  <!-- Kacheln -->
  <g fill="#f4f8fa">
    <rect x="446" y="182" width="158" height="108" rx="10"/><rect x="614" y="182" width="158" height="108" rx="10"/>
    <rect x="782" y="182" width="158" height="108" rx="10"/><rect x="950" y="182" width="162" height="108" rx="10"/>
  </g>
  <g class="k"><text x="462" y="204">DOKUMENTATION</text><text x="630" y="204">SERVICEANFRAGEN</text><text x="798" y="204">WARTUNG</text><text x="966" y="204">ERSATZTEILE</text></g>
  <text x="462" y="232" class="big">14 Dokumente</text>
  <text x="462" y="254" class="s">Wartungshandbuch,</text><text x="462" y="270" class="s">Schaltplan, Fehlerbaum</text>

  <text x="630" y="232" class="big">1 offen</text>
  <text x="630" y="254" class="s">#4752 Spindel wird heiß</text>
  <rect x="630" y="262" width="92" height="18" rx="9" fill="#e3eef5"/>
  <text x="676" y="275" text-anchor="middle" class="s" style="font-size:10px;fill:#1c638c;font-weight:600">In Bearbeitung</text>

  <text x="798" y="232" class="big">Fällig 14.10.</text>
  <text x="798" y="254" class="s">Jahreswartung</text><text x="798" y="270" class="s">Letzte: 29.09., quittiert</text>

  <text x="966" y="232" class="big">3 im Warenkorb</text>
  <text x="966" y="254" class="s">Teileliste</text><text x="966" y="270" class="s">Spindeleinheit</text>

  <!-- Historie -->
  <text x="446" y="320" class="k">HISTORIE</text>
  <path d="M452 338V446" stroke="#e3ebf0" stroke-width="2"/>
  <g stroke="#fff" stroke-width="2">
    <circle cx="452" cy="342" r="6" fill="#1c638c"/><circle cx="452" cy="376" r="6" fill="#17805f"/>
    <circle cx="452" cy="410" r="6" fill="#6f8796"/><circle cx="452" cy="444" r="6" fill="#17805f"/>
  </g>
  <g class="s" style="fill:#175173;font-size:12px">
    <text x="470" y="346">Anfrage #4752 erstellt, mit 3 Fotos und Video <tspan style="fill:#8a969d">· Kunde</tspan></text>
    <text x="470" y="380">Halbjahreswartung quittiert, Nachweis ans ERP <tspan style="fill:#8a969d">· Servicepartner Nord</tspan></text>
    <text x="470" y="414">Wartungshandbuch Rev. C bereitgestellt <tspan style="fill:#8a969d">· Serviceteam</tspan></text>
    <text x="470" y="448">Ersatzteilbestellung an den Webshop übergeben <tspan style="fill:#8a969d">· Kunde</tspan></text>
  </g>
  <g class="s" text-anchor="end" style="font-size:11px">
    <text x="1112" y="346">29.09.</text><text x="1112" y="380">29.09.</text><text x="1112" y="414">12.09.</text><text x="1112" y="448">02.09.</text>
  </g>
  <g stroke="#f4f8fa" stroke-width="1.5"><path d="M470 360H1112M470 394H1112M470 428H1112"/></g>
</svg>
