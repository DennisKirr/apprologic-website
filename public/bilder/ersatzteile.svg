<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Ersatzteilkatalog im Portal: Explosionszeichnung der Spindeleinheit mit nummerierten Positionen und daneben die Teileliste. Position 4, der Wellendichtring, ist in Zeichnung und Liste markiert. Das Teiledetail zeigt Teilenummer, Verwendungsnachweis und die Schaltfläche „Zum Warenkorb hinzufügen“; im Warenkorb liegen bereits drei Positionen.">
  <style>
    text { font-family: "Work Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .t { font-size: 14px; font-weight: 600; fill: #175173; }
    .s { font-size: 12px; fill: #6f777c; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .r { font-size: 12.5px; fill: #175173; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .h { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; fill: #8a969d; }
    .cap { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; fill: #17805f; }
    .b { font-size: 12px; font-weight: 700; text-anchor: middle; }
    .part { fill: #dfeaf1; stroke: #9fb3c0; stroke-width: 2; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f0f5"/>
      <stop offset="1" stop-color="#f7fafc"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".12" r=".55">
      <stop offset="0" stop-color="#24b38a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#24b38a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#c9d9e3"/>
    </pattern>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#edf2f5" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f3a53" flood-opacity=".22"/>
    </filter>
    <clipPath id="win"><rect x="60" y="40" width="860" height="440" rx="14"/></clipPath>
  </defs>

  <!-- Hintergrund -->
  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#dots)" opacity=".7"/>
  <rect width="1200" height="560" fill="url(#glow)"/>

  <!-- Fenster -->
  <rect x="60" y="40" width="860" height="440" rx="14" fill="#fff" filter="url(#shadow)"/>
  <g clip-path="url(#win)">
    <rect x="60" y="40" width="860" height="44" fill="#f4f8fa"/>
    <rect x="76" y="96" width="428" height="370" rx="10" fill="url(#grid)"/>
  </g>
  <path d="M60 84H920" stroke="#e3ebf0" stroke-width="1.5"/>
  <g fill="#d3dee5"><circle cx="82" cy="62" r="5"/><circle cx="100" cy="62" r="5"/><circle cx="118" cy="62" r="5"/></g>
  <text x="142" y="66" class="s">Bearbeitungszentrum · SN 24-1087  ›  <tspan style="fill:#175173;font-weight:600">Spindeleinheit</tspan></text>

  <!-- Warenkorb -->
  <g fill="none" stroke="#175173" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M778 54H783L787 70H801L805 59H785"/><circle cx="789" cy="75" r="1.8"/><circle cx="799" cy="75" r="1.8"/>
  </g>
  <circle cx="806" cy="52" r="8" fill="#17805f"/>
  <text x="806" y="56" class="b" style="font-size:10.5px" fill="#fff">3</text>
  <text x="822" y="67" class="t" style="font-size:13px">Warenkorb</text>

  <!-- Explosionszeichnung -->
  <text x="92" y="122" class="cap">EXPLOSIONSZEICHNUNG</text>
  <g transform="translate(0 24)">
  <path d="M90 300H496" stroke="#c3d4de" stroke-width="1.5" stroke-dasharray="14 5 3 5"/>

  <rect x="100" y="220" width="100" height="160" rx="10" class="part"/>
  <rect x="186" y="250" width="20" height="100" rx="4" class="part"/>
  <g fill="#9fb3c0"><circle cx="118" cy="238" r="4"/><circle cx="118" cy="362" r="4"/></g>

  <rect x="236" y="262" width="22" height="76" rx="6" class="part"/>
  <path d="M236 282H258M236 318H258" stroke="#9fb3c0" stroke-width="2"/>

  <rect x="280" y="282" width="24" height="36" rx="4" class="part"/>
  <rect x="302" y="289" width="110" height="22" rx="4" class="part"/>

  <rect x="432" y="268" width="14" height="64" rx="6" fill="#bfeadb" stroke="#17805f" stroke-width="2.5"/>

  <rect x="466" y="240" width="20" height="120" rx="5" class="part"/>
  <g fill="#9fb3c0"><circle cx="476" cy="254" r="3.5"/><circle cx="476" cy="346" r="3.5"/></g>

  <g stroke="#9fb3c0" stroke-width="1.5">
    <path d="M150 193V220M247 193V262M345 193V289M490 193L478 240"/>
  </g>
  <path d="M426 193L437 268" stroke="#17805f" stroke-width="2"/>
  <g fill="#fff" stroke="#1c638c" stroke-width="2">
    <circle cx="150" cy="180" r="13"/><circle cx="247" cy="180" r="13"/><circle cx="345" cy="180" r="13"/><circle cx="490" cy="180" r="13"/>
  </g>
  <circle cx="426" cy="180" r="14" fill="#17805f"/>
  <g class="b" fill="#1c638c">
    <text x="150" y="184.5">1</text><text x="247" y="184.5">2</text><text x="345" y="184.5">3</text><text x="490" y="184.5">5</text>
  </g>
  <text x="426" y="184.5" class="b" fill="#fff">4</text>
  </g>

  <!-- Teileliste -->
  <rect x="520" y="96" width="384" height="32" rx="16" fill="#f4f8fa" stroke="#e3ebf0"/>
  <circle cx="540" cy="111" r="5" fill="none" stroke="#8a969d" stroke-width="1.8"/>
  <path d="M544 115L548 119" stroke="#8a969d" stroke-width="1.8" stroke-linecap="round"/>
  <text x="556" y="116" class="s" style="fill:#8a969d">Teilenummer, Benennung, Seriennummer …</text>

  <g class="h">
    <text x="532" y="152">POS.</text><text x="572" y="152">BENENNUNG</text><text x="726" y="152">TEILENR.</text><text x="890" y="152" text-anchor="end">MENGE</text>
  </g>
  <path d="M520 162H904" stroke="#e3ebf0" stroke-width="1.5"/>

  <rect x="520" y="264" width="384" height="34" rx="6" fill="#e9f7f2"/>
  <rect x="520" y="264" width="4" height="34" rx="2" fill="#17805f"/>
  <g stroke="#eef3f6" stroke-width="1.5"><path d="M520 196H904M520 230H904M520 264H904M520 332H904"/></g>

  <g class="r">
    <text x="536" y="184">1</text><text x="572" y="184">Gehäuse</text><text x="726" y="184">SE-1000</text><text x="890" y="184" text-anchor="end">1</text>
    <text x="536" y="218">2</text><text x="572" y="218">Rillenkugellager</text><text x="726" y="218">6205-2RS</text><text x="890" y="218" text-anchor="end">2</text>
    <text x="536" y="252">3</text><text x="572" y="252">Antriebswelle</text><text x="726" y="252">SE-1030</text><text x="890" y="252" text-anchor="end">1</text>
    <text x="536" y="320">5</text><text x="572" y="320">Lagerdeckel</text><text x="726" y="320">SE-1050</text><text x="890" y="320" text-anchor="end">1</text>
  </g>
  <g class="r" style="font-weight:700;fill:#17805f">
    <text x="536" y="286">4</text><text x="572" y="286">Wellendichtring</text><text x="726" y="286">WD-35x52x7</text><text x="890" y="286" text-anchor="end">1</text>
  </g>

  <!-- Teiledetail -->
  <rect x="850" y="300" width="290" height="192" rx="14" fill="#fff" filter="url(#shadow)"/>
  <rect x="870" y="320" width="58" height="58" rx="10" fill="#e9f7f2"/>
  <circle cx="899" cy="349" r="19" fill="none" stroke="#17805f" stroke-width="5"/>
  <circle cx="899" cy="349" r="11" fill="none" stroke="#24b38a" stroke-width="2"/>
  <text x="942" y="334" class="h" style="fill:#17805f">POS. 4</text>
  <text x="942" y="354" class="t">Wellendichtring</text>
  <text x="942" y="372" class="s">Teilenr. WD-35x52x7</text>
  <path d="M870 392H1120" stroke="#eef3f6" stroke-width="1.5"/>
  <text x="870" y="412" class="h">VERBAUT IN</text>
  <text x="870" y="430" class="s">Spindeleinheit, Antriebseinheit</text>

  <rect x="870" y="446" width="72" height="32" rx="8" fill="#fff" stroke="#d3dee5" stroke-width="1.5"/>
  <text x="884" y="467" class="t" style="fill:#8a969d">−</text>
  <text x="906" y="467" class="t" text-anchor="middle">1</text>
  <text x="928" y="467" class="t" text-anchor="end" style="fill:#8a969d">+</text>
  <rect x="952" y="446" width="170" height="32" rx="8" fill="#17805f"/>
  <text x="1037" y="466.5" class="b" fill="#fff">Zum Warenkorb hinzufügen</text>
</svg>
