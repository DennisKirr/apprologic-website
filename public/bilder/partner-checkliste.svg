<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Wartungscheckliste in der App auf dem Tablet eines Servicepartners, im Hintergrund die Maschine: erledigte Prüfpunkte mit Messwert und Foto.">
  <style>
    text { font-family: "Work Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .t { font-size: 14px; font-weight: 600; fill: #175173; }
    .s { font-size: 12px; fill: #6f777c; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .v { font-size: 13px; font-weight: 600; fill: #17805f; }
    .cap { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; fill: #17805f; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f0f5"/>
      <stop offset="1" stop-color="#f7fafc"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".12" r=".55">
      <stop offset="0" stop-color="#24b38a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#24b38a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#175173"/>
      <stop offset="1" stop-color="#1c638c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e1ebf1"/>
      <stop offset="1" stop-color="#d6e3eb"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#c9d9e3"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f3a53" flood-opacity=".22"/>
    </filter>
    <filter id="shadow-sm" x="-10%" y="-30%" width="120%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f3a53" flood-opacity=".09"/>
    </filter>
    <clipPath id="screen"><rect x="620" y="90" width="500" height="370" rx="12"/></clipPath>
  </defs>

  <!-- Hintergrund -->
  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#dots)" opacity=".7"/>
  <rect width="1200" height="560" fill="url(#glow)"/>
  <rect y="440" width="1200" height="120" fill="url(#floor)"/>
  <path d="M0 440H1200" stroke="#cddbe4" stroke-width="3"/>
  <path d="M0 458H1200" stroke="#24b38a" stroke-opacity=".28" stroke-width="4" stroke-dasharray="36 22"/>

  <text x="90" y="80" class="cap">IM FELD AN DER MASCHINE</text>

  <!-- Maschine -->
  <g filter="url(#shadow-sm)">
    <rect x="440" y="104" width="10" height="70" rx="3" fill="#9fb3c0"/>
    <rect x="432" y="78" width="26" height="18" rx="4" fill="#24b38a"/>
    <rect x="432" y="96" width="26" height="12" rx="3" fill="#d7e2e9"/>
    <rect x="90" y="170" width="400" height="270" rx="14" fill="#fff"/>
  </g>
  <path d="M104 170H476A14 14 0 0 1 490 184V206H90V184A14 14 0 0 1 104 170Z" fill="url(#hub)"/>
  <rect x="120" y="230" width="220" height="150" rx="8" fill="#dfeaf1"/>
  <rect x="120" y="230" width="220" height="150" rx="8" fill="none" stroke="#c3d4de" stroke-width="3"/>
  <g fill="#b3c6d2">
    <rect x="212" y="244" width="36" height="52" rx="4"/>
    <path d="M222 296H238L234 318H226Z"/>
    <rect x="150" y="340" width="160" height="22" rx="4"/>
  </g>
  <rect x="190" y="324" width="80" height="16" rx="3" fill="#9fb3c0"/>
  <rect x="370" y="230" width="90" height="130" rx="8" fill="#1d2a33"/>
  <rect x="380" y="242" width="70" height="44" rx="4" fill="#24b38a" fill-opacity=".85"/>
  <path d="M388 272L402 260L414 268L430 252L442 258" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#6f8796">
    <circle cx="392" cy="306" r="7"/><circle cx="415" cy="306" r="7"/><circle cx="438" cy="306" r="7"/>
    <circle cx="392" cy="332" r="7"/><circle cx="415" cy="332" r="7"/>
  </g>
  <circle cx="438" cy="332" r="8" fill="#e5484d"/>
  <rect x="120" y="398" width="124" height="26" rx="5" fill="#eef3f6" stroke="#d3e1ea"/>
  <text x="182" y="415.5" text-anchor="middle" class="s" style="font-size:11.5px;fill:#175173">SN 24-1087</text>
  <rect x="104" y="440" width="44" height="10" rx="3" fill="#9fb3c0"/>
  <rect x="432" y="440" width="44" height="10" rx="3" fill="#9fb3c0"/>

  <!-- Tablet mit Checkliste -->
  <rect x="600" y="70" width="540" height="410" rx="28" fill="#1d2a33" filter="url(#shadow)"/>
  <rect x="620" y="90" width="500" height="370" rx="12" fill="#fff"/>
  <g clip-path="url(#screen)">
    <rect x="620" y="90" width="500" height="58" fill="url(#hub)"/>
  </g>
  <text x="644" y="116" style="font-size:16px;font-weight:600" fill="#fff">Wartungscheckliste</text>
  <text x="644" y="135" class="s" style="fill:#fff;fill-opacity:.8">Jahreswartung · SN 24-1087</text>

  <!-- Prüfpunkte -->
  <g fill="#f4f8fa">
    <rect x="636" y="162" width="468" height="44" rx="8"/>
    <rect x="636" y="212" width="468" height="44" rx="8"/>
    <rect x="636" y="262" width="468" height="44" rx="8"/>
    <rect x="636" y="362" width="468" height="44" rx="8"/>
  </g>
  <rect x="636" y="312" width="468" height="44" rx="8" fill="#e9f7f2" stroke="#24b38a" stroke-width="1.5"/>

  <g fill="#24b38a">
    <circle cx="660" cy="184" r="11"/><circle cx="660" cy="234" r="11"/><circle cx="660" cy="284" r="11"/>
  </g>
  <g stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M655 184L659 188L666 180"/><path d="M655 234L659 238L666 230"/><path d="M655 284L659 288L666 280"/>
  </g>
  <circle cx="660" cy="334" r="10" fill="#fff" stroke="#24b38a" stroke-width="2"/>
  <circle cx="660" cy="384" r="10" fill="#fff" stroke="#b8c7d1" stroke-width="2"/>

  <text x="682" y="189" class="t">Sicherheitseinrichtungen prüfen</text>
  <text x="682" y="239" class="t">Hydraulikdruck messen</text>
  <text x="682" y="289" class="t">Filter tauschen</text>
  <text x="682" y="339" class="t">Schmierstellen abschmieren</text>
  <text x="682" y="389" class="t" style="fill:#8a969d">Probelauf dokumentieren</text>

  <text x="1088" y="189" text-anchor="end" class="v">i. O.</text>
  <text x="1088" y="239" text-anchor="end" class="v">182 bar</text>
  <rect x="1050" y="272" width="38" height="24" rx="4" fill="#dfeaf1"/>
  <path d="M1054 292L1064 282L1071 288L1076 284L1084 292Z" fill="#9fb3c0"/>
  <circle cx="1078" cy="279" r="2.5" fill="#9fb3c0"/>
  <text x="1088" y="339" text-anchor="end" class="s" style="fill:#17805f;font-weight:600">in Arbeit</text>
  <text x="1088" y="389" text-anchor="end" class="s">offen</text>

  <!-- Fortschritt und Quittieren -->
  <text x="636" y="432" class="s">3 von 5 erledigt</text>
  <rect x="636" y="442" width="300" height="6" rx="3" fill="#e3ebf0"/>
  <rect x="636" y="442" width="180" height="6" rx="3" fill="#24b38a"/>
  <rect x="968" y="418" width="136" height="32" rx="8" fill="#e3ebf0"/>
  <text x="1036" y="439" text-anchor="middle" class="t" style="fill:#8a969d">Quittieren</text>
</svg>
