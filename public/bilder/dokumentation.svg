<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Dokumentation je Maschine: links der Dokumentenbaum zur Maschine SN 24-1087, gefiltert auf Deutsch und Revision C, geordnet nach Betriebsanleitung, Installationsanleitung, Wartungsanweisungen, Schaltplänen, Fehlerbäumen und Schulungsvideos, dazu der Download aller Dokumente als ZIP. Rechts die Vorschau des Schaltplans Hauptantrieb, Blatt 3 von 12, gültig ab Baujahr 2020.">
  <style>
