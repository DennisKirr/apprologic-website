    .f { font-size: 12.5px; fill: #175173; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .n { font-size: 11px; fill: #8a969d; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; text-anchor: end; }
    .chip { font-size: 11px; font-weight: 600; fill: #1c638c; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; text-anchor: middle; }
    .sc { font-size: 10px; fill: #175173; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .ln { stroke: #175173; stroke-width: 1.6; fill: none; }
