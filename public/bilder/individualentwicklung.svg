<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Zwei Beispiele für Individualentwicklungen: links eine Plantafel, auf der Einsätze von vier Technikern über die Woche verteilt sind und ein Einsatz per Drag-and-drop verschoben wird. Rechts die App, die per Bluetooth mit der Maschine verbunden ist und Betriebsstunden, Fehlercode und Drehzahl ausliest.">
  <style>
    text { font-family: "Work Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .t { font-size: 13px; font-weight: 600; fill: #175173; }
    .s { font-size: 11.5px; fill: #6f777c; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .d { font-size: 11px; font-weight: 700; letter-spacing: .06em; fill: #8a969d; text-anchor: middle; }
    .bar { font-size: 11px; font-weight: 600; fill: #fff; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .cap { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; fill: #17805f; }
    .lbl { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; fill: #8a969d; }
    .val { font-size: 17px; font-weight: 600; fill: #175173; }
    .flow { stroke-dasharray: 2 10; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f0f5"/>
      <stop offset="1" stop-color="#f7fafc"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".12" r=".55">
      <stop offset="0" stop-color="#24b38a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#24b38a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#175173"/>
      <stop offset="1" stop-color="#1c638c"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#c9d9e3"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f3a53" flood-opacity=".22"/>
    </filter>
    <filter id="shadow-sm" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f3a53" flood-opacity=".22"/>
    </filter>
    <clipPath id="win"><rect x="60" y="66" width="620" height="444" rx="14"/></clipPath>
    <clipPath id="screen"><rect x="770" y="76" width="200" height="424" rx="24"/></clipPath>
  </defs>

  <!-- Hintergrund -->
  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#dots)" opacity=".7"/>
  <rect width="1200" height="560" fill="url(#glow)"/>

  <!-- ============ Plantafel ============ -->
  <text x="60" y="50" class="cap">PLANTAFEL FÜR TECHNIKER</text>
  <rect x="60" y="66" width="620" height="444" rx="14" fill="#fff" filter="url(#shadow)"/>
  <g clip-path="url(#win)"><rect x="60" y="66" width="620" height="40" fill="#f4f8fa"/></g>
  <path d="M60 106H680" stroke="#e3ebf0" stroke-width="1.5"/>
  <text x="80" y="91" class="t">KW 40 · Region Nord</text>
  <g class="s" style="font-size:11px">
    <circle cx="452" cy="87" r="5" fill="#17805f"/><text x="462" y="91">Wartung</text>
    <circle cx="530" cy="87" r="5" fill="#1c638c"/><text x="540" y="91">Störung</text>
    <circle cx="602" cy="87" r="5" fill="#6f8796"/><text x="612" y="91">Montage</text>
  </g>

  <g class="d">
    <text x="238" y="126">MO</text><text x="334" y="126">DI</text><text x="430" y="126">MI</text><text x="526" y="126">DO</text><text x="622" y="126">FR</text>
  </g>
  <g stroke="#eef3f6" stroke-width="1.5">
    <path d="M190 134V478M286 134V478M382 134V478M478 134V478M574 134V478"/>
    <path d="M76 134H670M76 220H670M76 306H670M76 392H670M76 478H670"/>
  </g>

  <!-- Techniker -->
  <g fill="#e3eef5"><circle cx="96" cy="177" r="15"/><circle cx="96" cy="263" r="15"/><circle cx="96" cy="349" r="15"/><circle cx="96" cy="435" r="15"/></g>
  <g class="t" style="font-size:11px" text-anchor="middle" fill="#1c638c">
    <text x="96" y="181" style="fill:#1c638c">MS</text><text x="96" y="267" style="fill:#1c638c">AY</text>
    <text x="96" y="353" style="fill:#1c638c">TW</text><text x="96" y="439" style="fill:#1c638c">LP</text>
  </g>
  <text x="118" y="174" class="t">M. Schulz</text><text x="118" y="190" class="s">Hydraulik</text>
  <text x="118" y="260" class="t">A. Yilmaz</text><text x="118" y="276" class="s">Elektrik</text>
  <text x="118" y="346" class="t">T. Wagner</text><text x="118" y="362" class="s">Mechanik</text>
  <text x="118" y="432" class="t">L. Petrov</text><text x="118" y="448" class="s">Steuerung</text>

  <!-- Einsätze -->
  <rect x="196" y="160" width="180" height="34" rx="8" fill="#17805f"/><text x="208" y="181" class="bar">Wartung · SN 24-1087</text>
  <rect x="484" y="160" width="84" height="34" rx="8" fill="#1c638c"/><text x="496" y="181" class="bar">#4711</text>
  <rect x="388" y="246" width="276" height="34" rx="8" fill="#6f8796"/><text x="400" y="267" class="bar">Inbetriebnahme · Linie 3</text>
  <rect x="196" y="332" width="84" height="34" rx="8" fill="#1c638c"/><text x="208" y="353" class="bar">#4630</text>
  <rect x="388" y="332" width="84" height="34" rx="8" fill="#17805f"/><text x="400" y="353" class="bar">Wartung</text>
  <rect x="580" y="332" width="84" height="34" rx="8" fill="#e9f7f2" stroke="#24b38a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="292" y="418" width="180" height="34" rx="8" fill="#17805f"/><text x="304" y="439" class="bar">Wartung · SN 23-0412</text>

  <!-- gezogener Einsatz -->
  <g transform="rotate(-3 610 392)">
    <rect x="566" y="374" width="96" height="36" rx="8" fill="#1c638c" filter="url(#shadow-sm)"/>
    <text x="578" y="396" class="bar">#4752</text>
  </g>
  <path d="M640 398L640 418L645 413L649 422L653 420L649 411L656 411Z" fill="#175173" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- ============ Bluetooth ============ -->
  <text x="760" y="50" class="cap">BLUETOOTH-VERBINDUNG ZUR MASCHINE</text>

  <!-- Maschine -->
  <g filter="url(#shadow-sm)">
    <rect x="1036" y="250" width="120" height="190" rx="12" fill="#fff"/>
  </g>
  <path d="M1048 250H1144A12 12 0 0 1 1156 262V278H1036V262A12 12 0 0 1 1048 250Z" fill="url(#hub)"/>
  <rect x="1052" y="294" width="88" height="44" rx="5" fill="#1d2a33"/>
  <rect x="1058" y="300" width="76" height="32" rx="3" fill="#24b38a" fill-opacity=".85"/>
  <g fill="#6f8796"><circle cx="1064" cy="358" r="6"/><circle cx="1084" cy="358" r="6"/><circle cx="1104" cy="358" r="6"/></g>
  <circle cx="1128" cy="358" r="7" fill="#e5484d"/>
  <rect x="1052" y="384" width="88" height="20" rx="4" fill="#eef3f6"/>
  <text x="1096" y="398" text-anchor="middle" class="s" style="font-size:10px;fill:#175173">SN 24-1087</text>
  <rect x="1044" y="440" width="30" height="8" rx="3" fill="#9fb3c0"/><rect x="1118" y="440" width="30" height="8" rx="3" fill="#9fb3c0"/>
  <circle cx="1096" cy="226" r="18" fill="#1c638c"/>
  <path d="M1091 219L1101 229L1096 234V218L1101 223L1091 233" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Funkverbindung -->
  <path d="M986 250Q1030 200 1074 222" fill="none" stroke="#24b38a" stroke-width="3" stroke-linecap="round" class="flow"/>
  <g fill="none" stroke="#24b38a" stroke-width="2.5" stroke-linecap="round" opacity=".55">
    <path d="M1122 214A26 26 0 0 1 1122 238"/><path d="M1132 204A40 40 0 0 1 1132 248"/>
  </g>

  <!-- Smartphone -->
  <rect x="760" y="66" width="220" height="444" rx="32" fill="#1d2a33" filter="url(#shadow)"/>
  <rect x="770" y="76" width="200" height="424" rx="24" fill="#fff"/>
  <g clip-path="url(#screen)"><rect x="770" y="76" width="200" height="92" fill="url(#hub)"/></g>
  <rect x="842" y="84" width="56" height="13" rx="6.5" fill="#1d2a33"/>
  <text x="786" y="124" style="font-size:14px;font-weight:600" fill="#fff">Maschine auslesen</text>
  <rect x="786" y="136" width="152" height="20" rx="10" fill="#fff" fill-opacity=".16"/>
  <circle cx="798" cy="146" r="4" fill="#24b38a"/>
  <text x="808" y="150" class="s" style="font-size:10.5px;fill:#fff;font-weight:600">Verbunden · SN 24-1087</text>

  <g fill="#f4f8fa">
    <rect x="784" y="182" width="172" height="58" rx="10"/>
    <rect x="784" y="248" width="172" height="58" rx="10"/>
    <rect x="784" y="314" width="172" height="58" rx="10"/>
  </g>
  <rect x="784" y="248" width="4" height="58" rx="2" fill="#e0a526"/>
  <text x="798" y="202" class="lbl">BETRIEBSSTUNDEN</text><text x="798" y="226" class="val">12.480 h</text>
  <text x="798" y="268" class="lbl">FEHLERCODE</text><text x="798" y="292" class="val">E-204 <tspan class="s" style="font-size:11px">Spindeltemp.</tspan></text>
  <text x="798" y="334" class="lbl">DREHZAHL SPINDEL</text><text x="798" y="358" class="val">8.000 min⁻¹</text>

  <rect x="784" y="388" width="172" height="36" rx="9" fill="#17805f"/>
  <text x="870" y="411" text-anchor="middle" class="bar" style="font-size:12px">An Anfrage anhängen</text>
  <text x="870" y="448" text-anchor="middle" class="s" style="font-size:10.5px">Werte gehen direkt in die</text>
  <text x="870" y="463" text-anchor="middle" class="s" style="font-size:10.5px">Maschinenakte, ohne Abtippen</text>
</svg>
