<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Wartung im Portal: links die Liste der fälligen Wartungen mit Status, von überfällig über fällig in fünf Tagen bis geplant. Rechts der Wartungsnachweis zur ausgewählten Halbjahreswartung: alle Prüfpunkte mit Ergebnis, Messwert im Sollbereich und Foto, quittiert vom Techniker und an ERP und Maschinenakte übertragen.">
  <style>
    text { font-family: "Work Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .t { font-size: 14px; font-weight: 600; fill: #175173; }
    .s { font-size: 12px; fill: #6f777c; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .r { font-size: 12.5px; fill: #175173; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .v { font-size: 12.5px; font-weight: 600; fill: #17805f; text-anchor: end; }
    .pill { font-size: 11px; font-weight: 600; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; text-anchor: middle; }
    .h { font-size: 16px; font-weight: 600; fill: #175173; }
    .chip { font-size: 11.5px; font-weight: 600; fill: #1c638c; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f0f5"/>
      <stop offset="1" stop-color="#f7fafc"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".12" r=".55">
      <stop offset="0" stop-color="#24b38a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#24b38a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#c9d9e3"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f3a53" flood-opacity=".22"/>
    </filter>
    <clipPath id="win"><rect x="60" y="30" width="1080" height="500" rx="14"/></clipPath>
  </defs>

  <!-- Hintergrund -->
  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#dots)" opacity=".7"/>
  <rect width="1200" height="560" fill="url(#glow)"/>

  <!-- Fenster -->
  <rect x="60" y="30" width="1080" height="500" rx="14" fill="#fff" filter="url(#shadow)"/>
  <g clip-path="url(#win)"><rect x="60" y="30" width="1080" height="42" fill="#f4f8fa"/></g>
