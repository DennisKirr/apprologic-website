  <text x="1092" y="218.5" class="v">i. O.</text>
  <text x="1092" y="256.5" class="v">v4.2.1</text>
  <text x="1092" y="294.5" class="v">182 bar</text>
  <rect x="1056" y="316" width="36" height="24" rx="4" fill="#dfeaf1"/>
  <path d="M1060 336L1069 327L1075 332L1080 328L1088 336Z" fill="#9fb3c0"/><circle cx="1082" cy="322" r="2.3" fill="#9fb3c0"/>
