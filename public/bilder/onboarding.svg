<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Onboarding in drei Schritten: Erstens die Einladung per E-Mail mit dem Hinweis, dass die Maschinen bereits hinterlegt sind, und der Schaltfläche Zugang aktivieren. Zweitens die Aktivierung, bei der E-Mail-Adresse und Unternehmen schon ausgefüllt sind und nur noch ein Passwort festgelegt wird. Drittens der Start im Portal mit den eigenen Maschinen, der Schaltfläche Serviceanfrage stellen und der Möglichkeit, Kollegen einzuladen.">
  <style>
    text { font-family: "Work Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .t { font-size: 13px; font-weight: 600; fill: #175173; }
    .s { font-size: 11.5px; fill: #6f777c; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .b { font-size: 12px; fill: #175173; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .k { font-size: 10px; font-weight: 700; letter-spacing: .07em; fill: #8a969d; }
    .h { font-size: 16px; font-weight: 600; fill: #175173; }
    .cap { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; fill: #17805f; }
    .btn { font-size: 12.5px; font-weight: 600; fill: #fff; text-anchor: middle; }
    .flow { stroke-dasharray: 2 10; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f0f5"/>
      <stop offset="1" stop-color="#f7fafc"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".12" r=".55">
      <stop offset="0" stop-color="#24b38a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#24b38a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#175173"/>
      <stop offset="1" stop-color="#1c638c"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#c9d9e3"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f3a53" flood-opacity=".2"/>
    </filter>
    <clipPath id="p1"><rect x="40" y="80" width="340" height="420" rx="14"/></clipPath>
    <clipPath id="p2"><rect x="430" y="80" width="340" height="420" rx="14"/></clipPath>
    <clipPath id="p3"><rect x="820" y="80" width="340" height="420" rx="14"/></clipPath>
  </defs>

  <!-- Hintergrund -->
  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#dots)" opacity=".7"/>
  <rect width="1200" height="560" fill="url(#glow)"/>

  <!-- Schrittköpfe -->
  <g fill="#17805f"><circle cx="54" cy="48" r="13"/><circle cx="444" cy="48" r="13"/><circle cx="834" cy="48" r="13"/></g>
  <g style="font-size:12.5px;font-weight:700" fill="#fff" text-anchor="middle"><text x="54" y="52.5">1</text><text x="444" y="52.5">2</text><text x="834" y="52.5">3</text></g>
  <text x="76" y="53" class="cap">EINLADEN</text>
  <text x="466" y="53" class="cap">AKTIVIEREN</text>
  <text x="856" y="53" class="cap">LOSLEGEN</text>

  <!-- Pfeile -->
  <g fill="none" stroke="#24b38a" stroke-width="3" stroke-linecap="round" class="flow"><path d="M388 290H422"/><path d="M778 290H812"/></g>
  <g fill="#24b38a"><path d="M422 283L431 290L422 297Z"/><path d="M812 283L821 290L812 297Z"/></g>

  <!-- ============ 1 Einladung ============ -->
  <rect x="40" y="80" width="340" height="420" rx="14" fill="#fff" filter="url(#shadow)"/>
  <g clip-path="url(#p1)"><rect x="40" y="80" width="340" height="40" fill="#f4f8fa"/></g>
  <path d="M40 120H380" stroke="#e3ebf0" stroke-width="1.5"/>
  <g fill="none" stroke="#175173" stroke-width="1.8" stroke-linejoin="round"><rect x="58" y="93" width="20" height="15" rx="2"/><path d="M58 95L68 102L78 95"/></g>
  <text x="88" y="105" class="t" style="font-size:12.5px">Posteingang</text>

  <text x="60" y="148" class="k">VON</text>
  <text x="60" y="164" class="b">Serviceportal Ihres Herstellers</text>
  <text x="60" y="188" class="k">BETREFF</text>
  <text x="60" y="204" class="t">Ihr Zugang zum Serviceportal</text>
  <path d="M60 218H360" stroke="#eef3f6" stroke-width="1.5"/>
  <text x="60" y="242" class="b">Guten Tag Frau Kühn,</text>
  <text x="60" y="266" class="b">unser Serviceteam hat Sie zum Service-</text>
  <text x="60" y="284" class="b">portal eingeladen. Ihre Maschinen sind</text>
  <text x="60" y="302" class="b">bereits hinterlegt.</text>
  <rect x="60" y="324" width="300" height="42" rx="10" fill="#17805f"/>
  <text x="210" y="350" class="btn" style="font-size:13.5px">Zugang aktivieren</text>
  <text x="60" y="394" class="s">Ein Klick genügt. Der Link ist persönlich</text>
  <text x="60" y="410" class="s">und nur für Sie bestimmt.</text>
  <rect x="60" y="436" width="300" height="44" rx="10" fill="#f4f8fa"/>
  <circle cx="82" cy="458" r="12" fill="#e3eef5"/>
  <text x="82" y="462" text-anchor="middle" style="font-size:10px;font-weight:700" fill="#1c638c">AY</text>
  <text x="102" y="454" class="t" style="font-size:11.5px">Eingeladen von A. Yilmaz</text>
  <text x="102" y="469" class="s" style="font-size:10.5px">Serviceteam, direkt aus der Service-Konsole</text>

  <!-- ============ 2 Aktivierung ============ -->
  <rect x="430" y="80" width="340" height="420" rx="14" fill="#fff" filter="url(#shadow)"/>
  <g clip-path="url(#p2)"><rect x="430" y="80" width="340" height="92" fill="url(#hub)"/></g>
  <circle cx="460" cy="112" r="10" fill="none" stroke="#fff" stroke-width="2.5"/>
  <text x="478" y="117" style="font-size:13px;font-weight:600" fill="#fff">Serviceportal</text>
  <text x="450" y="152" style="font-size:16px;font-weight:600" fill="#fff">Zugang aktivieren</text>

  <text x="450" y="200" class="k">E-MAIL</text>
  <rect x="450" y="208" width="300" height="34" rx="8" fill="#f4f8fa"/>
  <text x="464" y="229.5" class="b" style="fill:#6f777c">j.kuehn@beispiel.de</text>
  <path d="M728 220L732 224L739 216" fill="none" stroke="#17805f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="450" y="264" class="k">UNTERNEHMEN</text>
  <rect x="450" y="272" width="300" height="34" rx="8" fill="#f4f8fa"/>
  <text x="464" y="293.5" class="b" style="fill:#6f777c">Werk Nord · 6 Maschinen</text>
  <path d="M728 284L732 288L739 280" fill="none" stroke="#17805f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="450" y="328" class="k" style="fill:#17805f">PASSWORT FESTLEGEN</text>
  <rect x="450" y="336" width="300" height="38" rx="8" fill="#fff" stroke="#24b38a" stroke-width="2"/>
  <g fill="#175173"><circle cx="468" cy="355" r="3.5"/><circle cx="480" cy="355" r="3.5"/><circle cx="492" cy="355" r="3.5"/><circle cx="504" cy="355" r="3.5"/><circle cx="516" cy="355" r="3.5"/><circle cx="528" cy="355" r="3.5"/><circle cx="540" cy="355" r="3.5"/><circle cx="552" cy="355" r="3.5"/></g>
  <rect x="560" y="346" width="2" height="18" fill="#24b38a"/>
  <g fill="#24b38a"><rect x="450" y="380" width="72" height="4" rx="2"/><rect x="526" y="380" width="72" height="4" rx="2"/><rect x="602" y="380" width="72" height="4" rx="2"/></g>
  <rect x="678" y="380" width="72" height="4" rx="2" fill="#e3ebf0"/>

  <rect x="450" y="402" width="300" height="42" rx="10" fill="#17805f"/>
  <text x="600" y="428" class="btn" style="font-size:13.5px">Los geht’s</text>
  <text x="600" y="472" text-anchor="middle" class="s">Alles Weitere können Sie später ergänzen.</text>

  <!-- ============ 3 Im Portal ============ -->
  <rect x="820" y="80" width="340" height="420" rx="14" fill="#fff" filter="url(#shadow)"/>
  <g clip-path="url(#p3)"><rect x="820" y="80" width="340" height="40" fill="url(#hub)"/></g>
  <circle cx="842" cy="100" r="8" fill="none" stroke="#fff" stroke-width="2.2"/>
  <text x="858" y="104.5" style="font-size:12.5px;font-weight:600" fill="#fff">Serviceportal</text>

  <text x="840" y="150" class="h">Willkommen, Frau Kühn</text>
  <text x="840" y="168" class="s">Ihre Maschinen sind schon da.</text>

  <g fill="#f4f8fa"><rect x="840" y="182" width="300" height="38" rx="8"/><rect x="840" y="226" width="300" height="38" rx="8"/><rect x="840" y="270" width="300" height="38" rx="8"/></g>
  <g fill="#24b38a"><circle cx="856" cy="201" r="4"/><circle cx="856" cy="245" r="4"/></g><circle cx="856" cy="289" r="4" fill="#d18f16"/>
  <text x="868" y="205" class="t" style="font-size:12px">Bearbeitungszentrum</text><text x="1126" y="205" text-anchor="end" class="s" style="font-size:10.5px">SN 24-1087</text>
  <text x="868" y="249" class="t" style="font-size:12px">Verpackungslinie</text><text x="1126" y="249" text-anchor="end" class="s" style="font-size:10.5px">SN 23-0412</text>
  <text x="868" y="293" class="t" style="font-size:12px">Bearbeitungszentrum</text><text x="1126" y="293" text-anchor="end" class="s" style="font-size:10.5px">SN 24-1102</text>
  <text x="840" y="326" class="s" style="font-size:11px;fill:#1c638c;font-weight:600">+ 3 weitere Maschinen</text>

  <rect x="840" y="340" width="300" height="40" rx="10" fill="#17805f"/>
  <path d="M906 360H918M912 354V366" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="996" y="365" class="btn">Serviceanfrage stellen</text>

  <rect x="840" y="392" width="300" height="90" rx="10" fill="#fff" stroke="#bfe6d6" stroke-width="1.5"/>
  <text x="856" y="414" class="k" style="fill:#17805f">KOLLEGEN EINLADEN</text>
  <g stroke="#fff" stroke-width="2">
    <circle cx="870" cy="446" r="14" fill="#7fd6b8"/><circle cx="892" cy="446" r="14" fill="#b7d4e6"/><circle cx="914" cy="446" r="14" fill="#f3d58a"/>
  </g>
  <g style="font-size:10px;font-weight:700" fill="#175173" text-anchor="middle"><text x="870" y="450">JK</text><text x="892" y="450">MS</text><text x="914" y="450">RB</text></g>
  <circle cx="936" cy="446" r="14" fill="#fff" stroke="#24b38a" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M931 446H941M936 441V451" stroke="#17805f" stroke-width="1.8" stroke-linecap="round"/>
  <text x="962" y="442" class="b" style="font-size:11.5px">Instandhaltung, Einkauf,</text>
  <text x="962" y="458" class="b" style="font-size:11.5px">Schichtleitung: selbst</text>
  <text x="962" y="474" class="b" style="font-size:11.5px">einladen und verwalten</text>
</svg>
