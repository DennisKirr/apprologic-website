<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Fünf Fragen, die Ihre Kunden zu ihrer Maschine haben, und wo das Portal sie beantwortet: Wie geht das an dieser Maschine? Mit Dokumentation und KI, Antwort mit Quellenangabe. Die Maschine hat ein Problem, wer hilft? Mit der Serviceanfrage in vier Schritten. Wann ist die nächste Wartung? Mit der Checkliste und dem Nachweis. Welches Teil brauche ich? Aus der Explosionszeichnung in den Warenkorb. Hatten wir dieses Problem schon einmal? Die früheren Serviceanfragen der Maschine mit ihrer Lösung in der Maschinenakte.">
  <style>
    text { font-family: "Work Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .q { font-size: 16px; font-weight: 600; fill: #175173; }
    .m { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; fill: #17805f; }
    .a { font-size: 13px; font-weight: 600; fill: #175173; }
    .s { font-size: 11.5px; fill: #6f777c; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .x { font-size: 9.5px; fill: #6f777c; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .num { font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f0f5"/>
      <stop offset="1" stop-color="#f7fafc"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".12" r=".55">
      <stop offset="0" stop-color="#24b38a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#24b38a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#c9d9e3"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f3a53" flood-opacity=".16"/>
    </filter>
    <g id="card">
      <rect width="212" height="440" rx="16" fill="#fff" filter="url(#shadow)"/>
      <rect x="16" y="150" width="180" height="170" rx="10" fill="#f4f8fa"/>
      <path d="M16 340H196" stroke="#eef3f6" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- Hintergrund -->
  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#dots)" opacity=".7"/>
  <rect width="1200" height="560" fill="url(#glow)"/>
  <path d="M60 80H1140" stroke="#c3d4de" stroke-width="2" stroke-dasharray="3 7"/>

  <!-- 1 Dokumentation und KI -->
  <g transform="translate(40 60)">
    <use href="#card"/>
    <circle cx="32" cy="20" r="16" fill="#17805f" stroke="#fff" stroke-width="3"/><text x="32" y="24.5" class="num">1</text>
    <text x="18" y="62" class="m">DOKUMENTATION UND KI</text>
    <text x="18" y="94" class="q">„Wie geht das an</text><text x="18" y="115" class="q">dieser Maschine?“</text>
    <rect x="70" y="164" width="114" height="30" rx="9" fill="#1c638c"/>
    <rect x="80" y="174" width="80" height="4" rx="2" fill="#fff" fill-opacity=".7"/><rect x="80" y="183" width="56" height="4" rx="2" fill="#fff" fill-opacity=".7"/>
    <rect x="28" y="204" width="140" height="76" rx="9" fill="#fff"/>
    <g fill="#24b38a"><circle cx="42" cy="220" r="5"/><circle cx="42" cy="240" r="5"/><circle cx="42" cy="260" r="5"/></g>
    <g fill="#d3dee5"><rect x="54" y="218" width="96" height="4" rx="2"/><rect x="54" y="238" width="84" height="4" rx="2"/><rect x="54" y="258" width="90" height="4" rx="2"/></g>
    <rect x="28" y="290" width="62" height="18" rx="9" fill="#e9f7f2"/><text x="59" y="302.5" text-anchor="middle" class="x" style="fill:#17805f;font-weight:700">S. 42</text>
    <text x="18" y="368" class="a">Antwort mit Quelle</text>
    <text x="18" y="388" class="s">KI-Assistent und Doku-</text><text x="18" y="404" class="s">mentation zur Maschine</text>
  </g>

  <!-- 2 Serviceanfragen -->
  <g transform="translate(268 60)">
    <use href="#card"/>
    <circle cx="32" cy="20" r="16" fill="#17805f" stroke="#fff" stroke-width="3"/><text x="32" y="24.5" class="num">2</text>
    <text x="18" y="62" class="m">SERVICEANFRAGEN</text>
    <text x="18" y="94" class="q">„Die Maschine hat</text><text x="18" y="115" class="q">ein Problem. Wer</text><text x="18" y="136" class="q">hilft?“</text>
    <path d="M44 176H168" stroke="#24b38a" stroke-width="2.5"/>
    <g fill="#24b38a"><circle cx="44" cy="176" r="8"/><circle cx="85" cy="176" r="8"/><circle cx="126" cy="176" r="8"/></g>
    <circle cx="168" cy="176" r="8" fill="#1c638c"/>
    <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M40 176L43 179L48 173"/><path d="M81 176L84 179L89 173"/><path d="M122 176L125 179L130 173"/></g>
    <rect x="28" y="198" width="156" height="40" rx="7" fill="#fff"/>
    <g fill="#d3dee5"><rect x="38" y="209" width="120" height="4" rx="2"/><rect x="38" y="221" width="88" height="4" rx="2"/></g>
    <g fill="#dfeaf1"><rect x="28" y="246" width="44" height="40" rx="6"/><rect x="78" y="246" width="44" height="40" rx="6"/></g>
    <g fill="#9fb3c0"><path d="M32 282L46 266L56 276L68 282Z"/><path d="M82 282L96 268L106 278L118 282Z"/></g>
    <rect x="28" y="294" width="86" height="18" rx="9" fill="#e3eef5"/><text x="71" y="306.5" text-anchor="middle" class="x" style="fill:#1c638c;font-weight:700">In Bearbeitung</text>
    <text x="18" y="368" class="a">Anfrage in vier Schritten</text>
    <text x="18" y="388" class="s">Mit Fotos, direkt beim</text><text x="18" y="404" class="s">richtigen Team</text>
  </g>

  <!-- 3 Wartung -->
  <g transform="translate(496 60)">
    <use href="#card"/>
    <circle cx="32" cy="20" r="16" fill="#17805f" stroke="#fff" stroke-width="3"/><text x="32" y="24.5" class="num">3</text>
    <text x="18" y="62" class="m">WARTUNG</text>
    <text x="18" y="94" class="q">„Wann ist die</text><text x="18" y="115" class="q">nächste Wartung?“</text>
    <g fill="#fff"><rect x="28" y="164" width="156" height="30" rx="7"/><rect x="28" y="200" width="156" height="30" rx="7"/><rect x="28" y="236" width="156" height="30" rx="7"/></g>
    <g fill="#24b38a"><circle cx="44" cy="179" r="7"/><circle cx="44" cy="215" r="7"/><circle cx="44" cy="251" r="7"/></g>
    <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M41 179L43.5 181.5L47.5 176.5"/><path d="M41 215L43.5 217.5L47.5 212.5"/><path d="M41 251L43.5 253.5L47.5 248.5"/></g>
    <g fill="#d3dee5"><rect x="58" y="177" width="80" height="4" rx="2"/><rect x="58" y="213" width="70" height="4" rx="2"/><rect x="58" y="249" width="86" height="4" rx="2"/></g>
    <text x="176" y="182" text-anchor="end" class="x" style="fill:#17805f;font-weight:700">i. O.</text>
    <text x="176" y="218" text-anchor="end" class="x" style="fill:#17805f;font-weight:700">182 bar</text>
    <path d="M34 296C40 284 46 284 48 294C50 302 54 288 60 288C66 288 62 300 70 298" fill="none" stroke="#175173" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="104" y="284" width="80" height="20" rx="10" fill="#e9f7f2"/><text x="144" y="297.5" text-anchor="middle" class="x" style="fill:#17805f;font-weight:700">Quittiert</text>
    <text x="18" y="368" class="a">Checkliste mit Nachweis</text>
    <text x="18" y="388" class="s">Zurück ins ERP und in</text><text x="18" y="404" class="s">die Maschinenakte</text>
  </g>

  <!-- 4 Ersatzteile -->
  <g transform="translate(724 60)">
    <use href="#card"/>
    <circle cx="32" cy="20" r="16" fill="#17805f" stroke="#fff" stroke-width="3"/><text x="32" y="24.5" class="num">4</text>
    <text x="18" y="62" class="m">ERSATZTEILE</text>
    <text x="18" y="94" class="q">„Welches Teil</text><text x="18" y="115" class="q">brauche ich?“</text>
    <path d="M30 240H182" stroke="#c3d4de" stroke-width="1.2" stroke-dasharray="8 4 2 4"/>
    <g fill="#dfeaf1" stroke="#9fb3c0" stroke-width="1.5">
      <rect x="32" y="200" width="44" height="80" rx="6"/><rect x="86" y="216" width="12" height="48" rx="3"/>
      <rect x="108" y="232" width="46" height="16" rx="3"/><rect x="166" y="212" width="10" height="56" rx="3"/>
    </g>
    <rect x="140" y="220" width="10" height="40" rx="4" fill="#bfeadb" stroke="#17805f" stroke-width="2"/>
    <path d="M145 220V190" stroke="#17805f" stroke-width="1.5"/>
    <circle cx="145" cy="180" r="10" fill="#17805f"/><text x="145" y="184" text-anchor="middle" class="x" style="fill:#fff;font-weight:700;font-size:10px">4</text>
    <rect x="28" y="290" width="156" height="22" rx="8" fill="#17805f"/>
    <g fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M64 295H67L69 304H77L79 298H68"/><circle cx="71" cy="307.5" r="1"/><circle cx="76" cy="307.5" r="1"/></g>
    <text x="88" y="305" class="x" style="fill:#fff;font-weight:700;font-size:10px">In den Warenkorb</text>
    <text x="18" y="368" class="a">Aus der Zeichnung</text>
    <text x="18" y="388" class="s">in den Warenkorb und</text><text x="18" y="404" class="s">weiter an Ihren Webshop</text>
  </g>

  <!-- 5 Maschinenakte: frühere Anfragen -->
  <g transform="translate(952 60)">
    <use href="#card"/>
    <circle cx="32" cy="20" r="16" fill="#17805f" stroke="#fff" stroke-width="3"/><text x="32" y="24.5" class="num">5</text>
    <text x="18" y="62" class="m">MASCHINENAKTE</text>
    <text x="18" y="94" class="q">„Hatten wir dieses</text><text x="18" y="115" class="q">Problem schon</text><text x="18" y="136" class="q">einmal?“</text>
    <text x="28" y="168" class="x" style="font-weight:700;letter-spacing:.06em">FRÜHERE ANFRAGEN</text>
    <rect x="28" y="176" width="156" height="72" rx="8" fill="#e9f7f2" stroke="#24b38a" stroke-width="1.5"/>
    <text x="38" y="193" class="x" style="fill:#175173;font-weight:700;font-size:10.5px">#4711 Spindel überhitzt</text>
    <rect x="38" y="200" width="44" height="15" rx="7.5" fill="#fff"/><text x="60" y="210.5" text-anchor="middle" class="x" style="fill:#17805f;font-weight:700;font-size:9px">Gelöst</text>
    <text x="88" y="210.5" class="x" style="font-size:9px">März 2025</text>
    <text x="38" y="228" class="x" style="fill:#175173">Lösung: Schmierleitung</text>
    <text x="38" y="240" class="x" style="fill:#175173">gereinigt</text>
    <rect x="28" y="256" width="156" height="26" rx="8" fill="#fff"/>
    <text x="38" y="273" class="x" style="fill:#175173;font-weight:700">#4630 Warnung W-212</text>
    <rect x="28" y="288" width="156" height="26" rx="8" fill="#fff"/>
    <text x="38" y="305" class="x" style="fill:#175173;font-weight:700">#4502 Sensor Achse X</text>
    <text x="18" y="368" class="a">Die Vorgeschichte</text>
    <text x="18" y="388" class="s">Frühere Anfragen und ihre</text><text x="18" y="404" class="s">Lösung in der Akte</text>
  </g>
</svg>
