<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Serviceanfrage aus Sicht des Kunden: links der Anfrage-Assistent in vier Schritten – Typ, Maschine, Standort und Beschreibung mit Fotos und Video, dazu ein passender Abschnitt aus der Dokumentation als Vorschlag vor dem Absenden. Rechts die App mit der gestellten Anfrage, ihrem Status und dem Chat mit dem Service am Vorgang.">
  <style>
    text { font-family: "Work Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .t { font-size: 13.5px; font-weight: 600; fill: #175173; }
    .s { font-size: 11.5px; fill: #6f777c; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .r { font-size: 13px; fill: #175173; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; fill: #8a969d; }
    .b { font-size: 11.5px; fill: #175173; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .bw { font-size: 11.5px; fill: #fff; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
    .tm { font-size: 9.5px; fill: #8a969d; font-family: "Open Sans", "Segoe UI", Arial, sans-serif; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f0f5"/>
      <stop offset="1" stop-color="#f7fafc"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".12" r=".55">
      <stop offset="0" stop-color="#24b38a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#24b38a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#175173"/>
      <stop offset="1" stop-color="#1c638c"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#c9d9e3"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f3a53" flood-opacity=".22"/>
    </filter>
    <clipPath id="win"><rect x="60" y="40" width="700" height="480" rx="14"/></clipPath>
    <clipPath id="screen"><rect x="832" y="62" width="236" height="446" rx="26"/></clipPath>
  </defs>

  <!-- Hintergrund -->
  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#dots)" opacity=".7"/>
  <rect width="1200" height="560" fill="url(#glow)"/>

  <!-- ============ Assistent ============ -->
  <rect x="60" y="40" width="700" height="480" rx="14" fill="#fff" filter="url(#shadow)"/>
  <g clip-path="url(#win)"><rect x="60" y="40" width="700" height="42" fill="#f4f8fa"/></g>
  <path d="M60 82H760" stroke="#e3ebf0" stroke-width="1.5"/>
  <g fill="#d3dee5"><circle cx="82" cy="61" r="5"/><circle cx="100" cy="61" r="5"/><circle cx="118" cy="61" r="5"/></g>
  <text x="142" y="65" class="s" style="font-size:12px">Serviceanfragen  ›  <tspan style="fill:#175173;font-weight:600">Neue Anfrage</tspan></text>

  <!-- Schritte -->
  <path d="M150 112H600" stroke="#24b38a" stroke-width="3"/>
  <g fill="#24b38a"><circle cx="150" cy="112" r="14"/><circle cx="300" cy="112" r="14"/><circle cx="450" cy="112" r="14"/></g>
  <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M144 112L148 116L156 108"/><path d="M294 112L298 116L306 108"/><path d="M444 112L448 116L456 108"/>
  </g>
  <circle cx="600" cy="112" r="14" fill="#1c638c"/>
  <circle cx="600" cy="112" r="20" fill="none" stroke="#1c638c" stroke-opacity=".25" stroke-width="4"/>
  <text x="600" y="116.5" text-anchor="middle" style="font-size:12.5px;font-weight:700" fill="#fff">4</text>
  <g class="t" text-anchor="middle" style="font-size:12.5px">
    <text x="150" y="148">Typ</text><text x="300" y="148">Maschine</text><text x="450" y="148">Standort</text><text x="600" y="148">Beschreibung</text>
  </g>
  <g class="s" text-anchor="middle" style="font-size:11px">
    <text x="150" y="165">Technische Anfrage</text><text x="300" y="165">SN 24-1087</text><text x="450" y="165">Werk Nord</text><text x="600" y="165" style="fill:#1c638c">in Arbeit</text>
  </g>
  <path d="M84 184H736" stroke="#eef3f6" stroke-width="1.5"/>

  <!-- Beschreibung -->
  <text x="84" y="210" class="lbl">BESCHREIBUNG</text>
  <rect x="84" y="220" width="652" height="80" rx="10" fill="#fff" stroke="#d3dee5" stroke-width="1.5"/>
  <text x="102" y="248" class="r">Die Spindel wird nach etwa einer Stunde Betrieb heiß, danach erscheint</text>
  <text x="102" y="268" class="r">die Warnung W-212. Tritt seit Montag bei jeder Schicht auf.</text>

  <text x="84" y="328" class="lbl">FOTOS UND VIDEOS</text>
  <g fill="#dfeaf1">
    <rect x="84" y="338" width="72" height="72" rx="10"/><rect x="166" y="338" width="72" height="72" rx="10"/>
    <rect x="248" y="338" width="72" height="72" rx="10"/><rect x="330" y="338" width="72" height="72" rx="10"/>
  </g>
  <g fill="#9fb3c0">
    <path d="M92 400L112 378L126 392L136 384L148 400Z"/><circle cx="136" cy="356" r="6"/>
    <path d="M174 400L194 374L210 390L220 382L230 400Z"/><circle cx="220" cy="354" r="6"/>
    <path d="M256 400L274 382L290 394L300 386L312 400Z"/><circle cx="300" cy="358" r="6"/>
  </g>
  <circle cx="366" cy="374" r="17" fill="#175173" fill-opacity=".85"/>
  <path d="M361 365L375 374L361 383Z" fill="#fff"/>
  <text x="394" y="404" text-anchor="end" class="tm" style="fill:#175173;font-weight:600">0:24</text>
  <rect x="412" y="338" width="72" height="72" rx="10" fill="#fff" stroke="#b8c7d1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M448 364V384M438 374H458" stroke="#8a969d" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Vorschlag aus der Dokumentation -->
  <rect x="84" y="434" width="452" height="58" rx="10" fill="#e9f7f2" stroke="#bfe6d6"/>
  <path d="M106 451L108.5 458.5L116 461L108.5 463.5L106 471L103.5 463.5L96 461L103.5 458.5Z" fill="#17805f"/>
  <text x="128" y="456" class="lbl" style="fill:#17805f">VORSCHLAG AUS DER DOKUMENTATION</text>
  <text x="128" y="477" class="t" style="font-size:12.5px">Spindeltemperatur zu hoch: die drei häufigsten Ursachen</text>

  <rect x="556" y="446" width="180" height="40" rx="10" fill="#17805f"/>
  <text x="646" y="471" text-anchor="middle" style="font-size:13px;font-weight:600" fill="#fff">Anfrage senden</text>

  <!-- ============ App mit Chat ============ -->
  <rect x="820" y="50" width="260" height="470" rx="36" fill="#1d2a33" filter="url(#shadow)"/>
  <rect x="832" y="62" width="236" height="446" rx="26" fill="#fff"/>
  <g clip-path="url(#screen)"><rect x="832" y="62" width="236" height="96" fill="url(#hub)"/></g>
  <rect x="920" y="70" width="60" height="14" rx="7" fill="#1d2a33"/>
  <text x="848" y="108" class="tm" style="fill:#fff;fill-opacity:.8;font-size:10.5px">Anfrage #4752 · SN 24-1087</text>
  <text x="848" y="127" style="font-size:14px;font-weight:600" fill="#fff">Spindel wird heiß</text>
  <rect x="848" y="134" width="92" height="17" rx="8.5" fill="#fff" fill-opacity=".18"/>
  <circle cx="858" cy="142.5" r="3.5" fill="#7fd6b8"/>
  <text x="866" y="146.5" class="tm" style="fill:#fff;font-weight:600;font-size:10px">In Bearbeitung</text>

  <!-- Nachrichten -->
  <text x="950" y="180" text-anchor="middle" class="tm">Heute</text>
  <rect x="846" y="190" width="176" height="62" rx="12" fill="#f0f4f7"/>
  <text x="858" y="208" class="tm" style="font-weight:600;fill:#1c638c">Service · A. Yilmaz</text>
  <text x="858" y="225" class="b">Danke für die Fotos. Bitte prüfen</text>
  <text x="858" y="241" class="b">Sie den Füllstand der Schmierung.</text>

  <rect x="884" y="264" width="170" height="112" rx="12" fill="#17805f"/>
  <rect x="896" y="276" width="146" height="58" rx="8" fill="#fff" fill-opacity=".2"/>
  <path d="M904 328L926 306L940 320L950 312L1034 328Z" fill="#fff" fill-opacity=".45"/>
  <text x="896" y="352" class="bw">Füllstand ist zu niedrig,</text>
  <text x="896" y="367" class="bw">Foto anbei.</text>

  <rect x="846" y="388" width="176" height="62" rx="12" fill="#f0f4f7"/>
  <text x="858" y="406" class="tm" style="font-weight:600;fill:#1c638c">Service · A. Yilmaz</text>
  <text x="858" y="423" class="b">Das passende Schmierfett ist</text>
  <text x="858" y="439" class="b">unterwegs, ein Einsatz ist nicht nötig.</text>

  <!-- Eingabe -->
  <path d="M832 462H1068" stroke="#e3ebf0" stroke-width="1.5"/>
  <rect x="846" y="472" width="170" height="26" rx="13" fill="#f4f8fa"/>
  <text x="860" y="489" class="tm" style="font-size:10.5px">Nachricht schreiben …</text>
  <circle cx="1040" cy="485" r="14" fill="#17805f"/>
  <path d="M1034 485H1046M1041 480L1046 485L1041 490" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
